<div class="p-3 m-0">
    <div class="text-center mb-4">
        <h3>{{this.modalType}} Ticket</h3>
    </div>
    <form [formGroup]="createTicketForm">
        <div class="mb-4">
            <div class="row mb-2">
                <div class="col-3">
                    Title
                </div>
                <div class="col-9">
                    <input class="form-control" formControlName="title" />
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-3">
                    Description
                </div>
                <div class="col-9">
                    <textarea class="form-control" formControlName="description"></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-3">
                    Project Name
                </div>
                <div class="col-9">
                    <select id="projectchoice" class="form-control" formControlName="project">
                        <option value="">Project Name</option>
                        @for(item of this.dataShare.GetProjectList(); track item.id)
                        {
                            @if(this._updateTicket)
                            {
                                @if(this._updateTicket.projectid == item.id)
                                {
                                <option value="{{item.id}}" selected>{{item.name}}</option>
                                }
                                @else{
                                <option value="{{item.id}}">{{item.name}}</option>
                                }
                            }
                            @else{
                                <option value="{{item.id}}">{{item.name}}</option>
                            }
                        }

                    </select>

                </div>
            </div>
        </div>
    </form>

    <div>
        <div class="d-flex justify-content-end">
            @if(this._updateTicket)
            {
                <button class="btn btn-primary me-2" (click)="UpdateTicket()">Update Ticket</button>
            }
            @else{
                <button class="btn btn-primary me-2" (click)="CreateTicket()">Create Ticket</button>
            }
            
            <button class="btn btn-danger" (click)="activeModal.close()">Close</button>
        </div>
    </div>
</div>
